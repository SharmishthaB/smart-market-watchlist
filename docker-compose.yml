version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: groww_watchlist_db
    environment:
      POSTGRES_USER: ${DB_USER:-groww_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-groww_password}
      POSTGRES_DB: ${DB_NAME:-smart_watchlist}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./server/src/db/migrations/001_initial.sql:/docker-entrypoint-initdb.d/001_initial.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-groww_user} -d ${DB_NAME:-smart_watchlist}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - watchlist_net

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: groww_watchlist_server
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: postgresql://${DB_USER:-groww_user}:${DB_PASSWORD:-groww_password}@postgres:5432/${DB_NAME:-smart_watchlist}
      JWT_SECRET: ${JWT_SECRET:-super_secret_jwt_key_code_groww_2026}
      FINNHUB_API_KEY: ${FINNHUB_API_KEY:-}
      WATCHLIST_MAX_ITEMS: 50
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - watchlist_net

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: groww_watchlist_client
    ports:
      - "5173:80"
    depends_on:
      - server
    networks:
      - watchlist_net

volumes:
  pgdata:

networks:
  watchlist_net:
    driver: bridge
